name: Release desktop and mobile clients
# Release v0.5.0 build 11 — task management and synchronization update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Windows client
        run: flutter build windows --release

      # Actions artifacts are ZIP downloads already. Upload the directory itself
      # so trial builds only need to be extracted once.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 角色日程-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure fixed Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/jx3_tasks-release.jks
          printf 'storeFile=jx3_tasks-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/key.properties

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk 角色日程-Android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 角色日程-Android
          path: 角色日程-Android.apk
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS client
        run: flutter build macos --release

      - name: Package macOS client as DMG
        run: |
          mv build/macos/Build/Products/Release/jx3_tasks.app \
            build/macos/Build/Products/Release/角色日程.app
          hdiutil create \
            -volname "角色日程" \
            -srcfolder build/macos/Build/Products/Release/角色日程.app \
            -ov \
            -format UDZO \
            角色日程-macOS.dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 角色日程-macOS
          path: 角色日程-macOS.dmg
          if-no-files-found: error

  publish-release:
    # Branch pushes are trial builds. Only an explicit version tag may publish.
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release v0.5.0]')
    needs:
      - build-windows
      - build-android
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows files
        uses: actions/download-artifact@v4
        with:
          name: 角色日程-Windows-x64
          path: release-input/windows

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: 角色日程-Android
          path: release-input/android

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: 角色日程-macOS
          path: release-input/macos

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          (
            cd release-input/windows
            zip -r ../../release-assets/RoleSchedule-Windows-x64.zip .
          )
          cp release-input/android/角色日程-Android.apk release-assets/RoleSchedule-Android.apk
          cp release-input/macos/角色日程-macOS.dmg release-assets/RoleSchedule-macOS.dmg

      # GitHub strips non-ASCII characters from the actual release asset name.
      # Remove the superseded assets before re-uploading stable ASCII filenames.
      - name: Remove existing v0.5.0 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_ids="$(
            gh api repos/${{ github.repository }}/releases --paginate \
              --jq '.[] | select(.tag_name == "v0.5.0") | .assets[].id'
          )"
          for asset_id in $asset_ids; do
            gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$asset_id"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          target_commitish: ${{ github.sha }}
          name: v0.5.0 全部任务管理与同步增强
          files: release-assets/*
          body: |
            v0.5.0 全部任务管理与同步增强

            - 新增“全部任务”页，支持单选、多选、批量分配、删除和移入收集箱
            - 支持按游戏、角色、完成状态、即将过期和已逾期筛选任务
            - 角色任务可在全部任务页直接切换完成状态，部分完成显示已完成数量
            - 一次性任务会结合周末及中国节假日标记即将过期或已逾期
            - 新建任务支持开始日期，未设置时从分配角色当天开始
            - 游戏可定义文本、长文本、数字、单选、多选、开关、日期、时间和链接元数据
            - 同步页显示当前与最新云端版本，并定时检测其他设备上传的新备份
            - 修复从云端恢复后立即重复生成备份的问题
            - 默认使用浅色外观，日期与日历控件统一使用简体中文
            - 改进桌面端宽屏布局、筛选对齐、移动端标题操作与角色状态样式
            - Android 延续固定发布签名，可直接覆盖安装 v0.4.2
            - Windows 正式包保持单层 ZIP，macOS 使用 DMG
