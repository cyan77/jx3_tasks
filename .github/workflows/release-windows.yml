name: Release desktop and mobile clients
# Release v0.3.0 build 7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Windows client
        run: flutter build windows --release

      - name: Package Windows client
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath jx3_tasks-windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3_tasks-windows-x64
          path: jx3_tasks-windows-x64.zip
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure fixed Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/jx3_tasks-release.jks
          printf 'storeFile=jx3_tasks-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/key.properties

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk jx3_tasks-android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3_tasks-android
          path: jx3_tasks-android.apk
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS client
        run: flutter build macos --release

      - name: Package macOS client
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/jx3_tasks.app jx3_tasks-macos.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3_tasks-macos
          path: jx3_tasks-macos.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs:
      - build-windows
      - build-android
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: v0.3.0 游戏日界线、全游戏日历与收集箱计划
          files: release-assets/*
          body: |
            v0.3.0 游戏日界线、全游戏日历与收集箱计划

            - 游戏管理新增每日任务截止/刷新时间，每个游戏可独立设置
            - 例如设置 07:00，则当天 07:00 至次日 06:59 计为同一个任务日
            - 首页、任务矩阵、角色统计、一次性任务逾期和日历记录统一按游戏日界线计算
            - 日历汇总所有游戏、所有未归档角色的任务，并支持按游戏筛选
            - 日历任务显示游戏和角色信息，可直接完成或编辑
            - 收集箱任务可选填周期和截止日期，两项均不是必填
            - 未选择角色的新任务自动进入收集箱；分配角色后移出收集箱
            - 已分配任务移入收集箱时保留周期、截止日期、子任务和备注
            - 右上角立即同步按钮旁显示上次同步成功时间，失败同步不会更新时间
            - 延续固定 Android 发布签名，支持从 v0.2.1 及后续版本直接覆盖安装
            - 提供 Windows、Android 和 macOS 客户端
