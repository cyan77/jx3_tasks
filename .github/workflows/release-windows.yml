name: Release desktop and mobile clients
# Release v0.4.0 build 8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Windows client
        run: flutter build windows --release

      # Actions artifacts are ZIP downloads already. Upload the directory itself
      # so trial builds only need to be extracted once.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3_tasks-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure fixed Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/jx3_tasks-release.jks
          printf 'storeFile=jx3_tasks-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/key.properties

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk jx3_tasks-android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3_tasks-android
          path: jx3_tasks-android.apk
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS client
        run: flutter build macos --release

      - name: Package macOS client as DMG
        run: |
          hdiutil create \
            -volname "JX3 Tasks" \
            -srcfolder build/macos/Build/Products/Release/jx3_tasks.app \
            -ov \
            -format UDZO \
            jx3_tasks-macos.dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3_tasks-macos
          path: jx3_tasks-macos.dmg
          if-no-files-found: error

  publish-release:
    # Branch pushes are trial builds. Only an explicit version tag may publish.
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release v0.4.0]')
    needs:
      - build-windows
      - build-android
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows files
        uses: actions/download-artifact@v4
        with:
          name: jx3_tasks-windows-x64
          path: release-input/windows

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: jx3_tasks-android
          path: release-input/android

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: jx3_tasks-macos
          path: release-input/macos

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          (
            cd release-input/windows
            zip -r ../../release-assets/jx3_tasks-windows-x64.zip .
          )
          cp release-input/android/jx3_tasks-android.apk release-assets/
          cp release-input/macos/jx3_tasks-macos.dmg release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0
          target_commitish: ${{ github.sha }}
          name: v0.4.0 任务编辑、元数据与多端体验更新
          files: release-assets/*
          body: |
            v0.4.0 任务编辑、元数据与多端体验更新

            - 已有任务支持编辑频率、截止日期、目标次数、执行星期、备注和子任务
            - 编辑任务模板时可同步到所有已分配角色；仅编辑单个角色时不会影响其他角色
            - 支持复制/分配已有任务给尚未分配的角色
            - 相同任务支持一次选择多个角色并批量完成
            - 新增收集箱；未分配角色的任务可选填频率和截止日期
            - 已分配任务可移动到收集箱，也可删除单个角色任务或整组任务
            - 修复一次性任务完成后次日重复显示，以及未完成任务在截止日前隐藏的问题
            - 日历汇总所有游戏与角色任务，支持游戏筛选、日期选择及直接编辑/完成任务
            - 每个游戏可设置独立的每日任务刷新时间
            - 游戏支持自定义角色元数据，可新增、编辑和删除字段
            - 元数据支持单行文本、长文本、数字、单选、多选、开关、日期、时间和链接
            - WebDAV 在数据修改与退出前自动备份，启动时检测较新的云端备份
            - 修复本地刚上传的备份被误报为云端更新
            - 设置页新增检查更新，支持浅色、深色和跟随系统主题
            - 优化导航返回、搜索入口、标题对齐和日历筛选布局
            - 采用更柔和的灰绿配色，并优化桌面宽屏自适应和角色多列布局
            - Windows 测试附件只需解压一次；正式版提供单层 ZIP
            - macOS 正式版改为 DMG；Android 延续固定签名，可覆盖安装
            - 提供 Windows、Android 和 macOS 客户端
