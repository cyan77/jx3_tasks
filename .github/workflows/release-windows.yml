name: Release desktop and mobile clients
# Release v0.1.2 build 3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Windows client
        run: flutter build windows --release

      - name: Package Windows client
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath jx3_tasks-windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3_tasks-windows-x64
          path: jx3_tasks-windows-x64.zip
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk jx3_tasks-android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3_tasks-android
          path: jx3_tasks-android.apk
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS client
        run: flutter build macos --release

      - name: Package macOS client
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/jx3_tasks.app jx3_tasks-macos.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3_tasks-macos
          path: jx3_tasks-macos.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs:
      - build-windows
      - build-android
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          files: release-assets/*
          body: |
            v0.1.2 任务编辑与收集箱更新

            - 新增收集箱，可先记录未分配角色、未设置周期和日期的任务
            - 收集箱任务可在整理时批量分配角色，并设置周期、截止日期、目标次数、子任务和备注
            - 已有任务支持编辑名称、频率、截止日期、目标次数、日期、子任务和备注
            - 主任务新增子任务；编辑所有已分配角色时可同步子任务，单独编辑角色时互不影响
            - 日历日期支持点击选择，时间线任务支持完成、子任务完成和编辑
            - 修复本地自动同步刚上传后被误报为“云端有更新”的问题
            - 收集箱、本地修改和完成记录继续支持 WebDAV 自动备份
            - 提供 Windows、Android 和 macOS 客户端
