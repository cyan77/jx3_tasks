name: Generate README screenshots

on:
  push:
    paths:
      - test/readme_screenshots_test.dart
      - .github/workflows/readme-screenshots.yml

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: flutter pub get
      - run: flutter test --update-goldens test/readme_screenshots_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: test/goldens/*.png
          if-no-files-found: error
