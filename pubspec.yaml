name: jx3_tasks
description: A clean offline MMORPG multi-character task manager prototype.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  file_picker: ^11.0.3
  webdav_client: ^1.2.2
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/jx3_tasks_icon.png
  remove_alpha_ios: true
  background_color_ios: "#173C67"
  windows:
    generate: true
    image_path: assets/icon/jx3_tasks_icon.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/icon/jx3_tasks_icon.png
